<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 給与計算のアイコン（U-21 案A 給料袋）：出品登録（オレンジ）・経費精算（緑）と同じ作り。
       背景・白い線の太さ・斜めの値札をそろえ、色だけ青 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa6ff"/>
      <stop offset="1" stop-color="#1f5fd8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- 給料袋（縦長の袋・ふた・名前の欄） -->
  <path d="M372 222 h280 a32 32 0 0 1 32 32 v500 a32 32 0 0 1 -32 32 h-280 a32 32 0 0 1 -32 -32 v-500 a32 32 0 0 1 32 -32 z"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linejoin="round"/>
  <path d="M346 236 L512 352 L678 236" fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="440" y1="440" x2="440" y2="660" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  <line x1="520" y1="440" x2="520" y2="560" stroke="#3d8bff" stroke-width="30" stroke-linecap="round"/>
  <!-- 値札（¥） -->
  <g transform="translate(652 612) rotate(-18)">
    <path d="M0 0 h150 a26 26 0 0 1 26 26 v120 a26 26 0 0 1 -26 26 h-150 l-62 -86 z"
          fill="url(#blue)" stroke="#0b0d12" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="-18" cy="86" r="14" fill="#0b0d12"/>
    <path d="M52 40 L92 92 L132 40 M92 92 V142 M60 98 H124 M60 124 H124" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
